<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141C" media="(prefers-color-scheme: dark)">
<title>海龟汤</title>
<style>
/* ------------------------------------------------------------------
   设计：青花瓷碗。浅瓷白底、钴蓝点缀；汤底那一块是碗，碗沿两道蓝线。
   整页只有一个动效重点：汤底一段一段由模糊变清楚。
   ------------------------------------------------------------------ */
:root {
  --porcelain: #F2F4F7;   /* 页面底 */
  --glaze: #FFFFFF;       /* 浮起的表面：碗、输入区 */
  --ink: #1C2333;         /* 正文 */
  --slate: #5F6A7D;       /* 次要文字 */
  --rule: #DCE1EA;        /* 分隔线 */
  --cobalt: #26428B;      /* 青花蓝 */
  --cobalt-ink: #FFFFFF;  /* 蓝底上的字 */
  --wash: #E8EDF8;        /* 淡蓝釉，碗里 */
  --broth: #F4E3BF;       /* 汤色，刚揭开的那一段 */
  --broth-ink: #6E4C10;
  --shadow: 0 1px 2px rgba(28, 35, 51, .06), 0 6px 20px rgba(28, 35, 51, .06);

  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans",
          "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", Georgia, serif;
  --gutter: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --porcelain: #10141C; --glaze: #171C27; --ink: #E6E9F0; --slate: #98A2B5;
    --rule: #2A3242; --cobalt: #8EA8F0; --cobalt-ink: #10141C; --wash: #1D2539;
    --broth: #3B301C; --broth-ink: #EDCD8E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  --porcelain: #10141C; --glaze: #171C27; --ink: #E6E9F0; --slate: #98A2B5;
  --rule: #2A3242; --cobalt: #8EA8F0; --cobalt-ink: #10141C; --wash: #1D2539;
  --broth: #3B301C; --broth-ink: #EDCD8E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--porcelain);
  color: var(--ink);
  font: 15px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }   /* 否则 .fold 的 display:block 会盖掉 hidden */
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  max-width: 600px;
  margin: 0 auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---- 顶部：品牌 + 这道题的属性 ---- */
.bar {
  display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 14px) var(--gutter) 10px;
}
.mark {
  font: 600 20px/1 var(--serif);
  letter-spacing: .06em;
  margin-right: auto;
}
.tag {
  font-size: 12px; line-height: 1;
  color: var(--slate);
  padding: 6px 9px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  white-space: nowrap;
}
.tag.red { color: #A3362A; border-color: #EBC6BF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.red { color: #F0A194; border-color: #5A2E28; } }
.dots { display: inline-flex; gap: 3px; vertical-align: 1px; margin-left: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--rule); }
.dots i.on { background: var(--slate); }

/* ---- 题目 + 汤底：固定在上方 ---- */
.head {
  flex: none;
  max-height: 58dvh;
  overflow-y: auto;
  padding: 2px var(--gutter) 14px;
}
.scene {
  font: 19px/1.75 var(--serif);
  margin: 0;
  text-wrap: pretty;
}
.head.compact .scene {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: 17px;
}
.head.compact .bowl { margin-top: 8px; padding-bottom: 14px; }
.head.compact .answer {
  font-size: 15px; line-height: 1.75;
  max-height: calc(1.75em * 4);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.fold {
  display: block; margin: 4px 0 0 auto;
  background: none; border: 0; padding: 4px 0;
  font-size: 13px; color: var(--slate); cursor: pointer;
}
.fold:hover { color: var(--ink); }

/* 碗：碗沿两道蓝线，碗底比碗口圆 */
.bowl {
  margin-top: 12px;
  background:
    radial-gradient(120% 90% at 50% 0%, var(--glaze) 0%, transparent 70%),
    var(--wash);
  border-top: 4px double var(--cobalt);
  border-radius: 14px 14px 30px 30px;
  padding: 12px 18px 20px;
  box-shadow: var(--shadow);
}
.bowl-top {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 6px;
}
.bowl-name { font-size: 13px; font-weight: 600; color: var(--cobalt); letter-spacing: .04em; }
.bowl-count { font-size: 12px; color: var(--slate); font-variant-numeric: tabular-nums; }
.answer {
  font: 17px/1.85 var(--serif);
  margin: 0;
  word-break: break-all;
}
.seg { border-radius: 4px; }
.seg.hidden {
  color: var(--cobalt);
  opacity: .6;
  filter: blur(3.5px);
  user-select: none;
  -webkit-user-select: none;
}
.seg.shown { animation: surface 1.1s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes surface {
  0%   { filter: blur(3.5px); opacity: .4; background: var(--broth); }
  45%  { filter: blur(0);   opacity: 1;   background: var(--broth); }
  100% { filter: blur(0);   opacity: 1;   background: transparent; }
}

/* ---- 问答记录 ---- */
.log {
  flex: 1;
  overflow-y: auto;
  padding: 0 var(--gutter) 12px;
  -webkit-overflow-scrolling: touch;
}
.empty {
  color: var(--slate);
  font-size: 14px;
  margin: 18px 0;
  max-width: 30em;
}
.row {
  display: grid;
  grid-template-columns: 1.4em 1fr auto;
  gap: 8px;
  align-items: start;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
}
.row .n { font-size: 12px; color: var(--slate); padding-top: 3px; font-variant-numeric: tabular-nums; }
.row .q { word-break: break-word; }
.row.pending .q { color: var(--slate); }
.sub {
  grid-column: 2 / -1;
  font-size: 13px;
  color: var(--slate);
  margin-top: -2px;
}
.sub.gain { color: var(--cobalt); font-weight: 500; }
.sub.warn { color: var(--broth-ink); }

.chip {
  font-size: 13px; line-height: 1;
  padding: 6px 11px;
  border-radius: 999px;
  white-space: nowrap;
  border: 1px solid transparent;
  min-width: 2.6em; text-align: center;
}
.chip.yes   { background: var(--cobalt); color: var(--cobalt-ink); font-weight: 600; }
.chip.no    { border-color: var(--slate); color: var(--ink); }
.chip.moot  { border: 1px dashed var(--rule); color: var(--slate); }
.chip.again { background: var(--broth); color: var(--broth-ink); }
.chip.wait  { border-color: var(--rule); color: var(--slate); }
.chip.wait::after { content: "…"; display: inline-block; animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .3; } }

.note {
  margin: 12px 0;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
}
.note.hint { background: var(--wash); }
.note.hint b { color: var(--cobalt); font-weight: 600; margin-right: 6px; }
.note.err { color: var(--broth-ink); background: var(--broth); }

/* ---- 底部：输入 / 结果 ---- */
.dock {
  flex: none;
  padding: 10px var(--gutter) calc(env(safe-area-inset-bottom) + 12px);
  background: var(--porcelain);
  border-top: 1px solid var(--rule);
}
.field {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--glaze);
  border: 1px solid var(--rule);
  border-radius: 22px;
  padding: 5px 5px 5px 16px;
  box-shadow: var(--shadow);
}
.field:focus-within { border-color: var(--cobalt); }
.field textarea {
  flex: 1;
  border: 0; outline: 0; resize: none; background: transparent;
  color: var(--ink);
  font: 16px/1.5 var(--sans);   /* 16px 防止 iOS 聚焦时放大 */
  padding: 7px 0;
  max-height: 120px;
}
.field textarea::placeholder { color: var(--slate); opacity: .8; }
.send {
  flex: none;
  width: 38px; height: 38px;
  border: 0; border-radius: 50%;
  background: var(--cobalt); color: var(--cobalt-ink);
  display: grid; place-items: center;
  cursor: pointer;
}
.send:disabled { background: var(--rule); color: var(--slate); cursor: default; }
.send svg { width: 18px; height: 18px; }

.tools { display: flex; justify-content: space-between; margin-top: 8px; }
.tool {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; padding: 6px 4px;
  font-size: 13px; color: var(--slate); cursor: pointer;
}
.tool:hover:not(:disabled) { color: var(--ink); }
.tool:disabled { opacity: .45; cursor: default; }
.tool svg { width: 16px; height: 16px; }
.tool.confirm { color: #A3362A; font-weight: 600; }
.tools-left { display: flex; align-items: center; gap: 10px; }
.purse {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; color: var(--slate); font-variant-numeric: tabular-nums;
}
.purse svg { width: 14px; height: 14px; }
.purse.bump { animation: bump .6s ease; }
@keyframes bump { 40% { color: var(--cobalt); transform: scale(1.12); } }

/* 第二条提示：选怎么换 */
.choose { display: none; padding: 4px 0 2px; }
.dock.choosing .ask-area { display: none; }
.dock.choosing .choose { display: block; animation: rise .3s cubic-bezier(.2, .7, .2, 1) both; }
.choose h2 { font: 600 18px/1.3 var(--serif); margin: 0 0 4px; }
.choose p { margin: 0 0 12px; color: var(--slate); font-size: 14px; }
.choose .actions { flex-direction: column; }
.choose .btn { flex: none; width: 100%; }
.choose .btn:disabled { opacity: .55; cursor: default; }
.choose-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.fine { font-size: 12px; color: var(--slate); }

/* ---- 联机 ---- */
.iconbtn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--rule); background: var(--glaze); color: var(--slate);
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.iconbtn:hover { color: var(--ink); }
.iconbtn.on { background: var(--cobalt); border-color: var(--cobalt); color: var(--cobalt-ink); }
.iconbtn svg { width: 18px; height: 18px; }
.roomstrip {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 12px; padding: 8px 6px 8px 14px;
  background: var(--wash); border-radius: 12px; font-size: 13px; color: var(--slate);
}
.roomstrip b { color: var(--cobalt); font-size: 15px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.roomstrip .people { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roomstrip .tool { padding: 4px 6px; }
.who { display: block; font-size: 12px; color: var(--slate); line-height: 1.4; margin-bottom: 1px; }
.who.mine { color: var(--cobalt); }
.sysline { text-align: center; font-size: 12px; color: var(--slate); margin: 10px 0; }

.lobby { display: none; padding: 4px 0 2px; }
/* 结束后也能打开联机面板：盖过 .dock.done .result 的 display:block */
.dock.lobbying .ask-area, .dock.lobbying .result, .dock.lobbying .choose { display: none !important; }
.dock.lobbying .lobby { display: block; animation: rise .3s cubic-bezier(.2, .7, .2, 1) both; }
.lobby h2 { font: 600 18px/1.3 var(--serif); margin: 0 0 4px; }
.lobby p { margin: 0 0 12px; color: var(--slate); font-size: 14px; }
.lbl { display: block; font-size: 12px; color: var(--slate); margin: 0 0 4px 2px; }
.text {
  width: 100%; height: 44px; padding: 0 14px;
  border: 1px solid var(--rule); border-radius: 12px; background: var(--glaze); color: var(--ink);
  font: 16px var(--sans); outline: none;
}
.text:focus { border-color: var(--cobalt); }
.lobby .actions { margin: 12px 0 10px; }
.joinrow { display: flex; gap: 8px; }
.joinrow .text { flex: 1; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.joinrow .btn { flex: none; width: 96px; height: 44px; }
.lobby .err { color: #A3362A; font-size: 13px; margin: 8px 2px 0; min-height: 1em; }

/* 本地模拟广告（ADS_MOCK=1） */
.mock-ad {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(16, 20, 28, .92); color: #fff;
  display: grid; place-items: center; text-align: center;
  font-family: var(--sans);
}
.mock-ad .box { max-width: 300px; padding: 24px; }
.mock-ad .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 12px 0; }
.mock-ad button {
  margin-top: 16px; height: 42px; padding: 0 22px; border-radius: 21px;
  border: 1px solid rgba(255, 255, 255, .4); background: none; color: #fff; font-size: 15px; cursor: pointer;
}

.result { display: none; padding: 6px 0 2px; }
.dock.done .ask-area { display: none; }
.dock.done .result { display: block; animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.result h2 { font: 600 22px/1.3 var(--serif); margin: 0 0 4px; }
.result p { margin: 0 0 14px; color: var(--slate); }
.actions { display: flex; gap: 10px; }
.btn {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 46px; border-radius: 23px;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--rule); background: var(--glaze); color: var(--ink);
}
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--cobalt-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { width: 17px; height: 17px; }

@media (min-width: 640px) {
  .app { padding-top: 12px; }
  .scene { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <span class="mark">海龟汤</span>
    <span class="tag" id="tagBroth" hidden></span>
    <span class="tag" id="tagGenre" hidden></span>
    <span class="tag" id="tagDiff" hidden></span>
    <button class="iconbtn" id="roomBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.6-.3 4.6 1.3 5 4.3"/></svg>
    </button>
  </header>

  <section class="head" id="head">
    <div class="roomstrip" id="roomStrip" hidden>
      <span id="roomLabel"></span>
      <span class="people" id="roomPeople"></span>
      <button class="tool" id="invite" type="button"></button>
      <button class="tool" id="leave" type="button"></button>
    </div>
    <p class="scene" id="scene"></p>
    <button class="fold" id="fold" hidden aria-controls="scene"></button>

    <div class="bowl" aria-labelledby="bowlName">
      <div class="bowl-top">
        <span class="bowl-name" id="bowlName"></span>
        <span class="bowl-count" id="bowlCount"></span>
      </div>
      <p class="answer" id="answer"></p>
    </div>
  </section>

  <main class="log" id="log" aria-live="polite"></main>

  <footer class="dock" id="dock">
    <div class="ask-area">
      <form class="field" id="form">
        <label class="sr" for="input" id="inputLabel"></label>
        <textarea id="input" rows="1" autocomplete="off" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
        </button>
      </form>
      <div class="tools">
        <div class="tools-left">
          <button class="tool" id="hint" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3Z"/></svg>
            <span id="hintLabel"></span>
          </button>
          <span class="purse" id="purse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg>
            <span id="purseLabel"></span>
          </span>
        </div>
        <button class="tool" id="giveup" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="giveupLabel"></span>
        </button>
      </div>
    </div>

    <div class="choose" id="choose" role="dialog" aria-labelledby="chooseTitle">
      <h2 id="chooseTitle"></h2>
      <p id="chooseLine"></p>
      <div class="actions">
        <button class="btn primary" id="payAd" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg>
          <span id="payAdLabel"></span>
        </button>
        <button class="btn" id="payPoints" type="button"></button>
      </div>
      <div class="choose-foot">
        <button class="tool" id="chooseCancel" type="button"></button>
        <a class="fine" id="adsNote" href="/privacy.html" target="_blank" rel="noopener"></a>
      </div>
    </div>

    <div class="lobby" id="lobby" role="dialog" aria-labelledby="lobbyTitle">
      <h2 id="lobbyTitle"></h2>
      <p id="lobbyLine"></p>
      <label class="lbl" for="nick" id="nickLabel"></label>
      <input class="text" id="nick" maxlength="12" autocomplete="nickname">
      <div class="actions">
        <button class="btn primary" id="createRoom" type="button"></button>
      </div>
      <div class="joinrow">
        <input class="text" id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off">
        <button class="btn" id="joinRoom" type="button"></button>
      </div>
      <p class="err" id="lobbyErr" role="alert"></p>
      <div class="choose-foot"><button class="tool" id="lobbyCancel" type="button"></button></div>
    </div>

    <div class="result" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultLine"></p>
      <div class="actions">
        <button class="btn primary" id="share" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
          <span id="shareLabel"></span>
        </button>
        <button class="btn" id="next" type="button"></button>
      </div>
    </div>
  </footer>

</div>

<script src="/app.js"></script>
</body>
</html>
